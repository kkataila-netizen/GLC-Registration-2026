<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — GLC 2026</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #f5f0e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: inherit;
    }
    .reset-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }
    .reset-card__logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .reset-card__logo img {
      height: 48px;
    }
    .reset-card__title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #395542;
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .reset-card__sub {
      text-align: center;
      color: #666;
      font-size: 0.92rem;
      margin-bottom: 1.8rem;
    }
    .reset-field {
      margin-bottom: 1.1rem;
    }
    .reset-field label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #333;
    }
    .reset-field input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .reset-btn {
      width: 100%;
      padding: 0.75rem;
      background: #395542;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .reset-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .reset-msg {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-size: 0.92rem;
      text-align: center;
    }
    .reset-msg--error { background: #fef2f2; color: #b91c1c; }
    .reset-msg--success { background: #f0fdf4; color: #15803d; }
    .reset-back {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.9rem;
    }
    .reset-back a { color: #395542; text-decoration: none; font-weight: 600; }
    .reset-back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="reset-card__logo">
      <img src="/images/GLC-Green.png" alt="GLC">
    </div>
    <div class="reset-card__title">Reset Password</div>
    <div class="reset-card__sub">Enter your new password below.</div>

    <div id="invalidMsg" class="reset-msg reset-msg--error" hidden>
      This reset link is invalid or has expired. Please <a href="/home.html">request a new one</a>.
    </div>

    <form id="resetForm" hidden>
      <div class="reset-field">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="4" placeholder="At least 4 characters">
      </div>
      <div class="reset-field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Repeat your new password">
      </div>
      <button type="submit" class="reset-btn" id="resetBtn">Set New Password</button>
      <div id="resetMsg" class="reset-msg" hidden></div>
    </form>

    <div class="reset-back"><a href="/home.html">Back to home</a></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('resetForm');
    const invalidMsg = document.getElementById('invalidMsg');
    const resetMsg = document.getElementById('resetMsg');
    const resetBtn = document.getElementById('resetBtn');

    if (!token) {
      invalidMsg.hidden = false;
    } else {
      form.hidden = false;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetMsg.hidden = true;

      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        resetMsg.textContent = 'Passwords do not match.';
        resetMsg.className = 'reset-msg reset-msg--error';
        resetMsg.hidden = false;
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Saving...';

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (res.ok) {
          resetMsg.textContent = 'Password updated! Redirecting to login...';
          resetMsg.className = 'reset-msg reset-msg--success';
          resetMsg.hidden = false;
          form.querySelectorAll('input').forEach(i => i.disabled = true);
          setTimeout(() => { window.location.href = '/home.html'; }, 2000);
        } else {
          resetMsg.textContent = data.error || 'Something went wrong. Please try again.';
          resetMsg.className = 'reset-msg reset-msg--error';
          resetMsg.hidden = false;
          resetBtn.disabled = false;
          resetBtn.textContent = 'Set New Password';
        }
      } catch {
        resetMsg.textContent = 'Network error. Please try again.';
        resetMsg.className = 'reset-msg reset-msg--error';
        resetMsg.hidden = false;
        resetBtn.disabled = false;
        resetBtn.textContent = 'Set New Password';
      }
    });
  </script>
</body>
</html>
